[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "saaf-airlock"
version = "0.1.0"
description = "Airlock: the commit-time layer for SAAF agent repos"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
airlock = "airlock:main"

[tool.setuptools]
py-modules = ["airlock"]
